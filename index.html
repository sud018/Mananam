<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="మననం">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e2347">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;600&family=Noto+Sans+Telugu:wght@400;500&display=swap">
<title>మననం</title>
<style>
@font-face{font-family:"Mananam Mantra";src:url("fonts/TiroTelugu-mantra.woff2") format("woff2");font-display:swap}
:root{
  --ash:#ebe9e5; --ash-2:#f6f5f2; --indigo:#1e2347; --ink:#1a1c33;
  --kumkum:#b3122e; --turmeric:#d99a1e; --bilva:#2c5c4d; --muted:#6b6a72; --rule:#d3d0ca;
  --art-line:#1e2347; --art-accent:#d99a1e; --art-soft:#d9d4ea; --art-bg:#f6f5f2;
  --scale:1;
  --mantra:"Mananam Mantra","Noto Serif Telugu","Telugu Sangam MN",serif;
  --serif:"Telugu Sangam MN","Noto Serif Telugu","Gautami",serif;
  --sans:"Kohinoor Telugu","Noto Sans Telugu","Telugu MN",system-ui,sans-serif;
}
body.dark{
  --ash:#12142a; --ash-2:#1b1e3a; --indigo:#0b0d1f; --ink:#ece8de;
  --kumkum:#ff5a6e; --turmeric:#f2b64a; --bilva:#9fd6c0; --muted:#a3a2b4; --rule:#2e3156;
  --art-line:#e9e2cf; --art-accent:#f2b64a; --art-soft:#2c3060; --art-bg:#1b1e3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ash);color:var(--ink);font-family:var(--sans);line-height:1.6}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ .fade{animation:fade .35s ease both} @keyframes fade{from{opacity:0}to{opacity:1}} }

.band{position:sticky;top:0;z-index:5;background:var(--indigo);color:#f3efe6;padding:calc(env(safe-area-inset-top) + 6px) 10px 0}
.band-row{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto}
.band h1{flex:1;margin:0;font:600 1.05rem/1.3 var(--serif);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border-radius:10px;font-size:1.2rem;color:#f3efe6}
.ib:active{background:rgba(255,255,255,.12)}
.ib.ghost{visibility:hidden}
.tri{display:block;height:16px;max-width:720px;margin:4px auto 0;position:relative}
.tri::before{content:"";position:absolute;left:18%;right:18%;top:2px;height:12px;background:repeating-linear-gradient(to bottom,rgba(243,239,230,.85) 0 2px,transparent 2px 5px)}
.tri::after{content:"";position:absolute;left:50%;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--kumkum);box-shadow:0 0 0 2px var(--indigo)}
.prog{height:3px;background:rgba(255,255,255,.12);max-width:720px;margin:4px auto 0}
.prog i{display:block;height:100%;background:var(--turmeric);width:0;transition:width .25s}

.wrap{max-width:720px;margin:0 auto;padding:16px 18px 48px}
.hidden{display:none!important}

.hero{text-align:center;padding:26px 6px 10px}
.hero .om{font:400 4.2rem/1 var(--serif);color:var(--kumkum)}
.hero h2{margin:6px 0 2px;font:600 2rem/1.25 var(--serif);color:var(--indigo)}
body.dark .hero h2{color:var(--ink)}
.hero p{margin:0 auto;max-width:30em;color:var(--muted)}
.divider,.mrule{height:14px;margin:18px auto;max-width:200px;position:relative}
.mrule{max-width:150px;margin:16px auto 14px}
.divider::before,.mrule::before{content:"";position:absolute;inset:1px 0;background:repeating-linear-gradient(to bottom,var(--rule) 0 2px,transparent 2px 5px)}
.divider::after,.mrule::after{content:"";position:absolute;left:50%;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--kumkum);box-shadow:0 0 0 3px var(--ash)}
.resume{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0 14px;padding:14px 16px;border-radius:14px;background:var(--indigo);color:#f3efe6;text-align:left}
body.dark .resume{background:#2a2e5c}
.resume b{display:block;font:600 1.02rem var(--serif)}
.resume small{opacity:.8}
.resume .lamp{width:30px;height:30px;flex:none}
.cat-row .cnt{font:600 .85rem var(--sans);background:var(--ash-2);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;color:var(--kumkum)}
.cat-row .chev{font-size:1.6rem;color:var(--muted);margin-left:2px}
.cat-row{padding:20px 4px}
.cats{display:flex;gap:8px;margin:4px 0 10px;padding:4px;background:var(--ash-2);border:1px solid var(--rule);border-radius:16px}
.cats button{flex:1;padding:11px 6px;white-space:nowrap;border-radius:12px;font:600 .98rem var(--sans);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.cats button.on{background:var(--indigo);color:#f3efe6;box-shadow:0 2px 8px rgba(30,35,71,.25)}
.cats button small{font-size:.75rem;opacity:.8;background:rgba(127,127,127,.18);border-radius:999px;padding:1px 7px}
body.dark .cats button.on{background:var(--turmeric);color:#1a1405}
.text-row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 4px;border-bottom:1px solid var(--rule);text-align:left}
.text-row .sig{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font:400 1.7rem var(--serif);color:#f3efe6;background:var(--indigo)}
body.dark .text-row .sig{background:#2a2e5c}
.text-row b{display:block;font:600 1.18rem/1.35 var(--serif)}
.text-row small{color:var(--muted)}
.text-row[disabled]{opacity:.45;cursor:default}
.soon{font-size:.82rem;color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin-top:30px}

.part-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 4px;border-bottom:2px solid var(--kumkum);padding-bottom:4px}
.part-h h3{margin:0;font:600 1.45rem/1.3 var(--serif);color:var(--kumkum)}
.part-h span{color:var(--muted);font-size:.88rem}
.unit-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border-bottom:1px solid var(--rule);text-align:left}
.unit-row .thumb{width:78px;flex:none;border-radius:8px;overflow:hidden;line-height:0}
.unit-row .thumb svg{width:100%;height:auto}
.unit-row .t{flex:1;min-width:0}
.unit-row b{display:block;font:600 1.05rem/1.35 var(--serif)}
.unit-row small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.r{background:var(--turmeric)}

.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.92rem}
input[type=range]{width:100%;accent-color:var(--kumkum);height:32px;margin:2px 0 6px}
.art{margin:6px 0 10px;border-radius:14px;overflow:hidden;line-height:0}
.art svg{width:100%;height:auto}
.art-cap{font:400 .98rem/1.5 var(--serif);color:var(--muted);text-align:center;margin:0 0 14px}
.essence{border-left:3px solid var(--turmeric);padding:4px 0 4px 12px;margin:0 0 18px;font-size:calc(1rem*var(--scale));line-height:1.75}
.essence h4{margin:0 0 2px;font:600 .95rem var(--serif);color:var(--turmeric)}
.opening{text-align:center;color:var(--muted);font:400 calc(1rem*var(--scale))/1.6 var(--serif);margin-bottom:6px}
.vnum{text-align:center;font:600 1rem var(--serif);color:var(--kumkum);margin:8px 0 4px}
.verse{white-space:pre-line;text-align:center;font:400 calc(1.38rem*var(--scale))/2.05 var(--mantra);color:var(--indigo);margin:0 0 6px;border-radius:12px;padding:2px 4px;transition:background .2s}
body.dark .verse{color:var(--ink)}
body.noaudio .mychant,body.noaudio #btnAll,body.noaudio #btnChantUnit,body.noaudio .small-play{display:none!important}
.meaning b.nm{font-family:var(--mantra);color:var(--kumkum);font-weight:600}
.meaning{white-space:pre-line;font-size:calc(1.14rem*var(--scale));line-height:1.95;color:var(--bilva);border-radius:12px;padding:2px 4px;transition:background .2s}
.speaking{background:rgba(217,154,30,.16)}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--rule)}
.lrow .ln{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ash-2);border:1px solid var(--rule);font:600 .8rem/30px var(--sans);text-align:center;color:var(--kumkum);margin-top:4px}
.lrow .lv{font:500 calc(1.22rem*var(--scale))/1.6 var(--mantra);color:var(--indigo)}
body.dark .lrow .lv{color:#e6e2d6}
.lrow .lm{font-size:calc(1rem*var(--scale));line-height:1.6;color:var(--bilva);margin-top:2px}
.nw{white-space:nowrap}
.fblock{margin:0 0 26px;text-align:center}
.fl{white-space:pre-line;font:400 calc(1.26rem*var(--scale))/1.95 var(--mantra);color:var(--indigo);cursor:pointer;border-radius:8px;padding:0 4px}
.fl.st{margin:14px 0}
.fl:active,.fullv:active{background:var(--ash-2)}
body.dark .fl{color:#e6e2d6}
.fullv.n2{font-size:calc(1.16rem*var(--scale));line-height:1.9;margin:0 0 16px}
.fsec{font:700 1.22rem var(--sans);color:var(--kumkum);text-align:center;margin:30px 0 12px}
.fsec.sub{font-size:1.06rem;margin:22px 0 10px}
.fsp{font:700 1.02rem var(--sans);color:var(--indigo);text-align:center;margin:14px 0 2px}
body.dark .fsp{color:#c9cdf0}
.readbtn{display:block;width:100%;margin:8px 0 2px;padding:12px;border-radius:12px;border:1.5px solid var(--indigo);color:var(--indigo);font:600 1rem var(--sans);background:var(--ash-2)}
body.dark .readbtn{border-color:#9aa0d8;color:#c9cdf0}
.fullh{text-align:center;margin:6px 0 2px}
.fullh h2{font:600 1.6rem var(--sans);color:var(--kumkum);margin:0}
.fullu{font:600 1.02rem var(--sans);color:var(--kumkum);text-align:center;margin:26px 0 8px;letter-spacing:.02em}
.fullu:before,.fullu:after{content:'❖';color:var(--turmeric);margin:0 10px;font-size:.8rem}
.fullv{white-space:pre-line;text-align:center;font:400 calc(1.32rem*var(--scale))/2.05 var(--mantra);color:var(--indigo);margin:0 0 10px;padding:2px 4px;border-radius:10px;cursor:pointer}
.fullv:active{background:var(--ash-2)}
.fullv i{font:500 .72rem var(--sans);color:var(--muted);font-style:normal;vertical-align:super;margin-left:4px}
body.dark .fullv{color:#e6e2d6}
.fullbar{display:flex;gap:8px;justify-content:center;margin:10px 0 4px}
.fullbar button{padding:9px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--ash-2);font:600 .95rem var(--sans);color:var(--indigo)}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:2px 0 4px}
.legend b{font:400 1.1rem var(--mantra);color:var(--kumkum)}
.derived{display:block;font-size:.85rem;color:var(--muted);margin-top:8px}
.reveal{display:block;width:100%;padding:18px;border:1.5px dashed var(--kumkum);border-radius:14px;color:var(--kumkum);font:600 1.05rem var(--serif)}
.sumhead{text-align:center;font:600 1.25rem var(--serif);color:var(--kumkum);margin:4px 0 0}

.listen{margin:22px 0 4px}
.playall{display:block;width:100%;padding:15px;border-radius:14px;background:var(--turmeric);color:#1a1405;font:600 1.06rem var(--sans)}
.playall.on{background:var(--kumkum);color:#fff}
.small-play{display:flex;gap:8px;margin-top:8px}
.small-play button{flex:1;padding:11px 6px;border-radius:12px;border:1.5px solid var(--turmeric);font:500 .98rem var(--sans)}
.small-play button.on{background:var(--turmeric);color:#1a1405}
.small-play button:disabled{opacity:.4}
.status{font-size:.85rem;color:var(--muted);margin:6px 2px 0}
.nav{display:flex;gap:10px;margin:16px 0}
.nav button{flex:1;padding:16px;border-radius:14px;background:var(--indigo);color:#f3efe6;font:600 1.08rem var(--serif)}
body.dark .nav button{background:#2a2e5c}
.nav button[disabled]{opacity:.3}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border:1px solid var(--rule);border-radius:999px;font-size:.95rem;background:var(--ash-2)}
.chip[aria-pressed=true]{background:var(--kumkum);border-color:var(--kumkum);color:#fff}
.note{margin-top:20px}
.note label{display:block;font:600 .95rem var(--serif);color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:84px;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--ash-2);color:var(--ink);font:inherit;font-size:1rem}

.chantbtn{display:block;width:100%;margin:8px 0 2px;padding:12px;border-radius:12px;border:1.5px solid var(--kumkum);color:var(--kumkum);font:600 1rem var(--sans);background:var(--ash-2)}
.mychant{display:flex;gap:8px;margin:10px 0 0}
.mychant button{flex:1;padding:11px;border-radius:12px;border:1px dashed var(--rule);font:500 .95rem var(--sans);color:var(--muted);background:var(--ash-2)}
.chantunit{display:block;width:100%;margin:10px 0 0;padding:13px;border-radius:14px;border:1.5px solid var(--kumkum);color:var(--kumkum);font:600 1.02rem var(--sans);background:var(--ash-2)}
#cp{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--indigo);color:#fff;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.3);max-width:720px;margin:0 auto;border-radius:16px 16px 0 0}
#cp.hidden{display:none}
#cp .cphead{display:flex;align-items:center;gap:8px}
#cp .cphead b{flex:1;font:600 1rem var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cp .cphead button{color:#fff;font-size:1.3rem;padding:2px 8px}
#cp .cpmain{display:flex;align-items:center;gap:10px;margin-top:6px}
#cp .cpmain .pp{width:50px;height:50px;border-radius:50%;background:var(--turmeric);color:#1a1405;font-size:1.3rem;flex:none}
#cp .cpmain .sk{color:#fff;font-size:.9rem;padding:6px;flex:none}
#cp input[type=range]{flex:1;accent-color:var(--turmeric);margin:0}
#cp .cptime{font:500 .82rem var(--sans);opacity:.85;min-width:84px;text-align:right}
#cp .ytrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
#cp .ytrow button{padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:.92rem}
#cp .ytrow button.on{background:var(--turmeric);border-color:var(--turmeric);color:#1a1405}
body.cpopen .wrap{padding-bottom:190px}
#yt{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--indigo);color:#fff;padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.3);max-width:720px;margin:0 auto;border-radius:16px 16px 0 0}
#yt.hidden{display:none}
#yt .ythead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#yt .ythead b{flex:1;font:600 .98rem var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#yt .ythead button{color:#fff;font-size:1.3rem;padding:2px 8px}
#ytBox{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:16/9;max-height:28vh;background:#000;border-radius:8px;overflow:hidden}
#ytBox iframe,#ytBox>div{position:absolute;inset:0;width:100%;height:100%}
#yt .ytrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
#yt .ytrow button{padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:.92rem}
#yt .ytrow button.on{background:var(--turmeric);border-color:var(--turmeric);color:#1a1405}
#yt .marknext{font-size:.9rem;text-align:center;margin-top:8px;opacity:.95}
#yt .bigmark{display:block;width:100%;margin-top:6px;padding:14px;border-radius:12px;background:var(--turmeric);color:#1a1405;font:700 1.05rem var(--sans)}
body.ytopen .wrap{padding-bottom:46vh}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,30,.5);display:none}
.sheet.open{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--ash);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet h4{margin:2px 4px 10px;font:600 1.15rem var(--serif);color:var(--kumkum)}
.li{display:flex;gap:12px;width:100%;padding:12px 6px;border-bottom:1px solid var(--rule);text-align:left;font:400 1rem var(--serif)}
.li b{min-width:2em;color:var(--kumkum)}
.li[aria-current=true]{background:var(--ash-2)}
.set{padding:12px 2px;border-bottom:1px solid var(--rule)}
.set > label,.set > span{display:block;font:600 .98rem var(--serif);margin-bottom:6px}
.set small{display:block;color:var(--muted);font-size:.85rem;margin-top:6px;line-height:1.5}
.seg{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 4px;font-size:.93rem;background:var(--ash-2)}
.seg button[aria-pressed=true]{background:var(--indigo);color:#f3efe6}
body.dark .seg button[aria-pressed=true]{background:#2a2e5c}
.set select{width:100%;padding:11px 8px;border-radius:12px;border:1px solid var(--rule);background:var(--ash-2);color:var(--ink);font:inherit}
.done{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;background:var(--indigo);color:#f3efe6;font:600 1rem var(--sans)}
body.dark .done{background:#2a2e5c}
.err{color:var(--kumkum);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header class="band">
  <div class="band-row">
    <button class="ib ghost" id="btnBack">←</button>
    <h1 id="title">మననం</h1>
    <button class="ib" id="btnSettings">⚙</button>
  </div>
  <span class="tri" aria-hidden="true"></span>
  <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
</header>

<main>
<div class="wrap" id="library"></div>
<div class="wrap hidden" id="contents"></div>
<div class="wrap hidden" id="full"></div>
<div class="wrap hidden" id="reader">
  <div class="meta"><span id="where"></span><span id="count"></span></div>
  <input type="range" id="slider" min="1" max="1" value="1">
  <div id="topArea"></div>
  <div id="verseArea"></div>
  <div class="mrule" aria-hidden="true"></div>
  <div id="meaningArea"></div>
  <div class="listen">
    <button class="playall" id="btnAll"></button>
    <button class="chantunit hidden" id="btnChantUnit"></button>
    <div class="small-play">
      <button id="btnMantra"></button>
      <button id="btnMeaning"></button>
    </div>
    <div class="status" id="voiceStatus"></div>
    <div class="small-play" id="recRow">
      <button id="btnRec"></button>
      <button id="btnRecA"></button>
    </div>
    <div class="small-play"><button id="btnAddChant"></button></div>
    <div class="chips" id="recDels" style="margin-top:8px"></div>
    <div class="status" id="recStatus"></div>
  </div>
  <div class="nav">
    <button id="btnPrev"></button>
    <button id="btnNext"></button>
  </div>
  <div class="chips">
    <button class="chip" id="btnMark" aria-pressed="false"></button>
    <button class="chip" id="btnList"></button>
    <button class="chip" id="btnHide" aria-pressed="false"></button>
    <button class="chip" id="btnArt" aria-pressed="true"></button>
  </div>
  <div class="note">
    <label for="noteBox" id="noteLabel"></label>
    <textarea id="noteBox"></textarea>
  </div>
</div>
</main>

<div id="cp" class="hidden">
  <div class="cphead"><b id="cpTitle"></b><button id="cpClose" aria-label="close">✕</button></div>
  <div class="cpmain"><button class="sk" id="cpBack">↺10</button><button class="pp" id="cpPlay">▶</button><button class="sk" id="cpFwd">10↻</button>
    <input type="range" id="cpSeek" min="0" max="1000" value="0"><span class="cptime" id="cpTime">0:00</span></div>
  <div class="ytrow" id="cpSpeeds"></div>
</div>
<input type="file" id="chantFile" accept="audio/*,.mp3,.m4a,.wav,.zip,application/zip" multiple hidden>
<div id="yt" class="hidden">

function t(k, u){ var s = (STR[S.lang] || STR.te)[k] || STR.te[k] || k; return u === undefined ? s : s.replace('{u}', u); }
function en(){ return S.lang === 'en'; }
function tx(obj, f){ return (en() && obj[f+'En']) || obj[f]; }

function libEntry(id){ return LIB.filter(function(e){ return e.id === id; })[0]; }
function findPart(id){ return T.parts.filter(function(p){ return p.id === id; })[0]; }
function findUnit(p, n){ return p.units.filter(function(u){ return u.n === n; })[0]; }
function steps(u){ var s = u.items.map(function(it){ return {kind:'v', v:it}; }); if(u.summary) s.push({kind:'s', text:u.summary}); return s; }
function ukey(p,u){ return T.id+'/'+p.id+'/'+u.n; }
function key(){ return ukey(cur.part,cur.unit)+'/'+(cur.idx+1); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function single(p){ return p.units.length === 1; }
function unitLabel(p){ return (p && tx(p,'unitLabel')) || tx(T,'unitLabel') || t('part'); }
function unitWord(p){ return (!p || single(p)) ? t('part') : unitLabel(p); }
function unitTitle(p,u){ return single(p) ? tx(p,'name') : tx(p,'name')+', '+unitLabel(p)+' '+u.n; }
function artFor(p,u){ return ART[p.id+'-'+u.n] || null; }
var VERSION = 'v20';
function footer(){ return OWNER ? '<p class="foot">© '+OWNER.year+' '+esc(en() ? OWNER.en : OWNER.te)+' – '+t('copy')+' · '+VERSION+'</p>' : ''; }

function show(which){
  screen = which;
  ['library','contents','reader','full'].forEach(function(id){ $(id).classList.toggle('hidden', id !== which); });
  $(which).classList.remove('fade'); void $(which).offsetWidth; $(which).classList.add('fade');
  $('btnBack').classList.toggle('ghost', which === 'library');
  if(which !== 'reader') $('progBar').style.width = '0';
  window.scrollTo(0,0);
}
function rerender(){
  if(screen === 'library') renderLibrary();
  else if(screen === 'contents') renderContents();
  else if(screen === 'full') renderFull(fullPid);
  else { staticLabels(); renderStep(); }
}
function loadScript(src, done){ var s = document.createElement('script'); s.src = src; s.onload = function(){ done(true); }; s.onerror = function(){ done(false); }; document.head.appendChild(s); }
function loadText(id, done){
  if(window.MANANAM_TEXTS[id]) return done(window.MANANAM_TEXTS[id]);
  loadScript('texts/'+encodeURIComponent(id)+'/text.js', function(){
    var tt = window.MANANAM_TEXTS[id] || null;
    loadScript('texts/'+encodeURIComponent(id)+'/art.js', function(){
      loadScript('audio/'+encodeURIComponent(id)+'/index.js', function(){
        loadScript('texts/'+encodeURIComponent(id)+'/chant.js', function(){ done(tt); });   // optional YouTube chanting
      });   // optional natural-voice audio
    });
  });
}
function applySettings(){
  document.documentElement.style.setProperty('--scale', S.scale);
  document.body.classList.toggle('dark', !!S.dark);
  document.documentElement.lang = S.lang;
  document.querySelector('meta[name=theme-color]').content = S.dark ? '#0b0d1f' : '#1e2347';
  save('settings', S);
}
function staticLabels(){
  $('btnBack').setAttribute('aria-label', t('back'));
  $('btnSettings').setAttribute('aria-label', t('settings'));
  $('slider').setAttribute('aria-label', t('jump'));
  $('btnPrev').textContent = t('prev'); $('btnNext').textContent = t('next');
  $('btnList').textContent = t('list'); $('btnHide').textContent = t('hide'); $('btnArt').textContent = t('art');
  $('btnHide').setAttribute('aria-pressed', !!S.hide); $('btnArt').setAttribute('aria-pressed', !!S.art);
  $('noteLabel').textContent = t('note'); $('noteBox').placeholder = t('notePh');
  setPlayUI(); voiceStatus();
}
var LAMP = '<svg class="lamp" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3c4 5 5 8 3 11-1 1.5-5 1.5-6 0-2-3-1-6 3-11z" fill="#f2b64a"/><path d="M4 18h22l-4 6H8z" fill="#d9d4ea"/></svg>';

/* ---------- library ---------- */
var CURCAT = null;   // null = home (list of sections); otherwise the open section
function catOf(e){ return e.category || (CATS[0] && CATS[0].id); }
function renderLibrary(){
  stopSpeech();
  var useCats = CATS.length > 1, cat = useCats && CURCAT ? CATS.filter(function(c){ return c.id === CURCAT; })[0] : null;
  if(useCats && CURCAT && !cat) CURCAT = null;
  var h = '';
  if(!cat){
    $('title').textContent = t('app'); document.title = t('app');
    h += '<div class="hero"><div class="om" aria-hidden="true">ॐ</div><h2>'+t('app')+'</h2><p>'+t('tagline')+'</p></div><div class="divider" aria-hidden="true"></div>';
    var le = LAST && libEntry(LAST.text);
    if(le && le.ready) h += '<button class="resume" id="resume">'+LAMP+'<span><b>'+t('cont')+'</b><small>'+esc(tx(le,'title'))+' – '+t('fromLeft')+'</small></span></button>';
  } else {
    $('title').textContent = tx(cat,'title'); document.title = tx(cat,'title');
    h += '<div class="hero"><div class="om" aria-hidden="true">'+esc(cat.icon || 'ॐ')+'</div><h2>'+esc(tx(cat,'title'))+'</h2>'+(tx(cat,'subtitle') ? '<p>'+esc(tx(cat,'subtitle'))+'</p>' : '')+'</div><div class="divider" aria-hidden="true"></div>';
  }
  if(useCats && !cat){   // home: one card per section
    CATS.forEach(function(c){
      var all = LIB.filter(function(e){ return catOf(e) === c.id; }), ready = all.filter(function(e){ return e.ready; });
      var names = (ready.length ? ready : all).slice(0, 4).map(function(e){ return tx(e,'title'); }).join(' · ');
      h += '<button class="text-row cat-row" data-cat="'+esc(c.id)+'">'+
           '<span class="sig" aria-hidden="true">'+esc(c.icon || 'ॐ')+'</span>'+
           '<span style="flex:1"><b>'+esc(tx(c,'title'))+'</b><small>'+esc(tx(c,'subtitle') || names)+'</small></span>'+
           (ready.length ? '<span class="cnt">'+ready.length+'</span>' : '<span class="soon">'+t('soon')+'</span>')+'<span class="chev" aria-hidden="true">›</span></button>';
    });
  } else {
    var shown = LIB.filter(function(e){ return !useCats || catOf(e) === cat.id; });
    if(!shown.length) h += '<p class="foot" style="margin:24px 0">'+t('soon')+'</p>';
    shown.forEach(function(e){
      h += '<button class="text-row" data-id="'+esc(e.id)+'"'+(e.ready?'':' disabled')+'>'+
           '<span class="sig" aria-hidden="true">'+esc(e.icon || 'ॐ')+'</span>'+
           '<span style="flex:1"><b>'+esc(tx(e,'title'))+'</b><small>'+esc(tx(e,'subtitle') || '')+'</small></span>'+
           (e.ready ? '' : '<span class="soon">'+t('soon')+'</span>')+'</button>';
    });
  }
  $('library').innerHTML = h + footer();
  show('library');
  $('btnBack').classList.toggle('ghost', !cat);
  Array.prototype.forEach.call($('library').querySelectorAll('[data-cat]'), function(b){ b.onclick = function(){ CURCAT = b.getAttribute('data-cat'); renderLibrary(); }; });
  Array.prototype.forEach.call($('library').querySelectorAll('.text-row[data-id]:not([disabled])'), function(b){ b.onclick = function(){ openText(b.getAttribute('data-id')); }; });
  var r = $('resume'); if(r) r.onclick = function(){ var e = libEntry(LAST.text); if(e) CURCAT = catOf(e); openText(LAST.text, function(){ openUnit(LAST.part, LAST.unit, LAST.idx); }); };
}

/* Telugu script → Devanagari, so a Hindi/Sanskrit voice can read the Sanskrit mantra */
function toDeva(s){
  s = s.replace(/గ్ం/g, 'ం').replace(/[()]/g, ' ').replace(/శ్లో॥/g, '');
  var out = '';
  for(var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    if(c >= 0x0C00 && c <= 0x0C7F){
      if(c === 0x0C46) c = 0x0C47;       // short e sign → e
      else if(c === 0x0C4A) c = 0x0C4B;  // short o sign → o
      else if(c === 0x0C0E) c = 0x0C0F;  // short e → e
      else if(c === 0x0C12) c = 0x0C13;  // short o → o
      else if(c === 0x0C31) c = 0x0C30;  // ఱ → ర
      out += String.fromCharCode(c - 0x0300);
    } else out += s[i];
  }
  return out;
}
function utter(text, kind){
  var v = kind === 'mantra' ? mantraVoice() : teluguVoice();
  var lang = v ? v.lang : (kind === 'mantra' ? 'hi-IN' : 'te-IN');
  if(kind === 'mantra' && !/^te/i.test(lang)) text = toDeva(text);
  var u = new SpeechSynthesisUtterance(text);
  if(v) u.voice = v;
  u.lang = lang; u.rate = S.rate * (kind === 'mantra' ? 0.9 : 1);
  return u;
}
function chunks(text){
  var parts = String(text).replace(/([।॥])\s*\n/g, '$1 ').replace(/\n/g, ' । ').match(/[^.!?।॥]+[.!?।॥]*/g) || [String(text)], out = [], buf = '';
  parts.forEach(function(p){ if((buf+p).length > 180 && buf){ out.push(buf); buf = p; } else buf += p; });
  if(buf) out.push(buf);
  return out.map(function(s){ return s.trim(); }).filter(function(s){ return /[ఀ-౿A-Za-z]/.test(s); });
}

/* ---------- my own chanting: recordings kept on this device ---------- */
var DB = null, RECS = {};   // key -> object URL
function idb(cb){
  if(DB) return cb(DB);

    var r = indexedDB.open('mananam', 1);

}

    var st = db.transaction('rec').objectStore('rec'), req = st.openCursor();
    req.onsuccess = function(){ var c = req.result; if(c){ RECS[c.key] = URL.createObjectURL(c.value); c.continue(); } else if(screen === 'reader') renderStep(); else if(screen === 'contents') renderContents(); };
  });
}

function saveRec(k, blob){
  idb(function(db){ if(!db) return; db.transaction('rec','readwrite').objectStore('rec').put(blob, k); });
  if(RECS[k]) URL.revokeObjectURL(RECS[k]); RECS[k] = URL.createObjectURL(blob);
}

  idb(function(db){ if(!db) return; db.transaction('rec','readwrite').objectStore('rec').delete(k); });
  if(RECS[k]) URL.revokeObjectURL(RECS[k]); delete RECS[k];
}
var recorder = null, recChunks = [], recKind = null;

function toggleRecord(kind){
  if(recorder){ recorder.stop(); return; }
  if(!canRecord()){ $('recStatus').textContent = t('recNo'); return; }
  stopSpeech();
  recKind = kind;
  var k = kind === 'meaning' ? key()+'-a' : key();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recChunks = [];
    var type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].filter(function(m){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); })[0];
    recorder = type ? new MediaRecorder(stream, {mimeType:type}) : new MediaRecorder(stream);
    recorder.ondataavailable = function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = function(){
      stream.getTracks().forEach(function(tr){ tr.stop(); });
      if(recChunks.length) saveRec(k, new Blob(recChunks, {type: recorder.mimeType || 'audio/mp4'}));
      recorder = null; recKind = null; recUI();
    };
    recorder.start(); recUI();
  }).catch(function(){ $('recStatus').textContent = t('recDenied'); });
}
function recUI(){

  var hasM = isV && !!recURL(key()), hasA = !!(it && recURL(key()+'-a'));

  $('btnRec').classList.toggle('on', recKind === 'mantra');

function sayQueue(list, my, done){   // list of {kind, src} or {kind, text}

var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

function chantTimes(pid){   // built-in times, overridden by times marked on this device
  var c = chantFor(pid) || {}, mine = load('chant.'+T.id+'.'+pid, null);

}
function partOrder(pid){   // every mantra of the part in order: "unit-item"

}

function numEnd(txt, n){   // put the number at the end: "… ॥" -> "… ॥ n ॥" (before a closing "… ఓం నమ ఇతి" refrain)
  var m = txt.match(/^([\s\S]*?)(\n[^\n]*నమ ఇతి[^\n]*)$/);
  if(m) return numEnd(m[1], n)+m[2];
  var tag = '\u00a0॥\u00a0'+n+'\u00a0॥';
  return /॥\s*$/.test(txt) ? txt.replace(/\s*॥\s*$/, tag) : txt.replace(/\s+$/, '')+tag;
}
function verseHTML(txt, n, attrs){   // speaker line in bold, then the verse with its number
  var lines = txt.split('\n'), sp = '';
  if(/ఉవాచ\s*[–-]?\s*$/.test(lines[0]) || /^శ్లో॥|మంత్రః$/.test(lines[0].trim())){ sp = lines.shift().replace(/\s*[–-]\s*$/, ''); }
  return (sp ? '<div class="fsp">'+esc(sp)+'</div>' : '')+'<p class="fullv n2"'+attrs+'>'+(n ? nw(esc(numEnd(lines.join('\n'), n))) : esc(lines.join('\n')))+'</p>';
}
function nw(html){ return html.replace(/(\S*\u00a0॥\u00a0\d+\u00a0॥)/, '<span class="nw">$1</span>'); }
function anuvakaHTML(p, u){   // one block per anuvakam, a line per mantra, ॥ n ॥ only at the end

function unzipStored(buf){   // reads a plain (uncompressed) zip: [{name, blob}]
  var dv = new DataView(buf), out = [], i = 0;
  while(i + 30 <= buf.byteLength && dv.getUint32(i, true) === 0x04034b50){
    var method = dv.getUint16(i+8, true), size = dv.getUint32(i+18, true), nl = dv.getUint16(i+26, true), xl = dv.getUint16(i+28, true);
    var name = new TextDecoder().decode(new Uint8Array(buf, i+30, nl)), start = i+30+nl+xl;
    if(method === 0 && size) out.push({name: name.split('/').pop(), blob: new Blob([new Uint8Array(buf, start, size)], {type:'audio/mpeg'})});
    i = start + size;
  }
  return out;
}
$('chantFile').onchange = function(){
  var input = this, files = Array.prototype.slice.call(this.files || []);
  var zips = files.filter(function(f){ return /\.zip$/i.test(f.name); });
  if(!zips.length) return addChantFiles(files, input);
  var all = files.filter(function(f){ return !/\.zip$/i.test(f.name); }), left = zips.length;
  zips.forEach(function(z){
    var r = new FileReader();
    r.onload = function(){ try{ unzipStored(r.result).forEach(function(e){ all.push({name: e.name, blob: e.blob}); }); }catch(e){} if(--left === 0) addChantFiles(all, input); };
    r.onerror = function(){ if(--left === 0) addChantFiles(all, input); };
    r.readAsArrayBuffer(z);
  });
};
function addChantFiles(files, input){

    if(ids.indexOf(pid) < 0) return;
    saveRec(myKey(pid, m[2].toLowerCase().replace(/^0(\d)/, '$1').replace(/-0(\d)/, '-$1')), f.blob || new Blob([f], {type: f.type || 'audio/mpeg'})); n++;

$('btnBack').onclick = function(){ if(screen === 'reader' || (screen === 'full' && !T.listMode)) renderContents(); else if(screen === 'library'){ if(CURCAT){ CURCAT = null; renderLibrary(); } } else renderLibrary(); };
$('btnSettings').onclick = openSettings;
$('btnPrev').onclick = function(){ go(-1); };
$('btnNext').onclick = function(){ go(1); };
$('slider').oninput = function(){ goTo(+this.value-1); };
$('btnAll').onclick = playAll;
$('btnMantra').onclick = function(){ playOne('mantra'); };
$('btnMeaning').onclick = function(){ playOne('meaning'); };
$('btnAddChant').onclick = function(){ $('chantFile').click(); };
$('btnChantUnit').onclick = function(){ stopSpeech(); openMy(cur.part.id, cur.unit.n, unitTitle(cur.part, cur.unit)); };
$('btnRec').onclick = function(){ toggleRecord('mantra'); };
$('btnRecA').onclick = function(){ toggleRecord('meaning'); };
$('btnHide').onclick = function(){ S.hide = !S.hide; applySettings(); staticLabels(); renderStep(); };
$('btnArt').onclick = function(){ S.art = !S.art; applySettings(); staticLabels(); renderStep(); };
$('btnList').onclick = openList;
$('btnMark').onclick = function(){ var k = key(); if(MARKS[k]) delete MARKS[k]; else MARKS[k] = 1; save('marks', MARKS); renderStep(); };
$('noteBox').oninput = function(){ NOTES[key()] = this.value; save('notes', NOTES); };

var sx = 0, sy = 0;
$('reader').addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$('reader').addEventListener('touchend', function(e){
  var tg = e.target.tagName; if(tg === 'TEXTAREA' || tg === 'INPUT' || tg === 'SELECT') return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6) go(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(screen !== 'reader' || /TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key === 'ArrowRight') go(1); else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === ' '){ e.preventDefault(); playAll(); }
});

window.__mananam = {toDeva: toDeva};
applySettings(); refreshVoices(); renderLibrary(); loadRecs();
if('serviceWorker' in navigator && location.protocol !== 'file:')
  window.addEventListener('load', function(){
    var had = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){ if(had && !reloaded){ reloaded = true; location.reload(); } });   // a new version arrived: show it at once
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(function(reg){ reg.update(); }).catch(function(){});
  });
})();
</script>
